{% extends "base.html" %}
{% block title %}Login | PlaceMe{% endblock %} 
{% block content %}
    <form action="{{ url_for('login') }}" method="POST" autocomplete="off">
            <div class="d-flex justify-content-center align-items-center vh-100">
                <div class="card p-4" style="width: 380px;">
                    <h3 class="text-center mb-4">Login</h3>
                    <div class="mb-3">
                        <label for="email">Email address</label>
                        <input type="text" class="form-control" id="email" name = "email" placeholder="Enter email" required>
                    </div>
                    <div class="mb-3">
                        <label for="email">Password</label>
                        <input type="password" class="form-control" id="password" name = "password" placeholder="Enter password" required minlength="6">
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id = "remeber">
                        <label class="form-check-label" for = "remeber">Remember me</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                    <p class="text-center mt-3">Don't have account? 
                        <br>
                        <a href="{{ url_for('student_register') }}">Register here as a Student</a> 
                        <br>
                        <a href="{{ url_for('recruiter_register') }}">Register here as a Recruiter</a>
                    </p>
                </div>
            </div>
    </form>
    
{% endblock %}
