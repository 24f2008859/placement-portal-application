{% extends "base.html" %}
{% block title %}Student Register | PlaceMe{% endblock %} 
{% block content %}
    <form action="{{ url_for('student_register') }}" method = "POST" enctype="multipart/form-data">
        <input type="hidden" name="role" value="student">
        <div class="d-flex justify-content-center align-items-center vh-100">
            <div class="card p-4" style="width: 500px;">
                    <h3 class="text-center mb-4">Create an account</h3>
                    
                    <div class="mb-3">
                        <label for="full-name">Full Name</label>
                        <input type="text" class="form-control" id="full-name" name = "name" placeholder="Enter your name">
                    </div>
                    <div class="mb-3">
                        <label for="email">Email Address</label>
                        <input type="email" class="form-control" id="email" name = "email" placeholder="Enter your email">
                    </div>
                    <div class="mb-3">
                        <label for="department">Department / Industry</label>
                        <input type="text" class="form-control" id="department" name = "department" placeholder="Enter your department">
                    </div>
                    <div class="mb-3">
                        <label>Skills</label>
                        <input type="text" class="form-control" name="skills" placeholder="e.g. Python, Flask, SQL">
                    </div>
                    <div class="mb-3">
                        <label>Resume</label>
                        <input type="file" class="form-control" name="resume" accept=".pdf">
                    </div>
                    <div class="mb-3">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" name = "password" placeholder="Enter password">
                    </div>
                    <div class="mb-3">
                        <label for="confirm-password">Confirm password</label>
                        <input type="password" class="form-control" id="confirm-password" name = "confirm-password" placeholder="Retype your password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                    <p class="text-center mt-3">Already have an account? <a href="{{url_for ('login') }}">Login here</a></p>
            </div>
        </div>
    </form>
{% endblock %}
